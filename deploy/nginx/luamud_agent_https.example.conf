# LuaMUD public web, WSS and Agent API routing.
# The game TCP and WebSocket bridge remain bound to 127.0.0.1.

server {
    listen 80;
    listen [::]:80;
    server_name 47.253.226.173;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type "text/plain";
    }

    location = /luamud { return 301 /luamud/; }
    location /luamud/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    location /luamud/ws {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name 47-253-226-173.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 47-253-226-173.nip.io;

    ssl_certificate /etc/letsencrypt/live/47-253-226-173.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47-253-226-173.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LuaMUDTLS:10m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /luamud { return 301 /luamud/; }

    # Agent API is intentionally HTTPS-only and requires an Authorization bearer token.
    location = /luamud/agent { return 301 /luamud/agent/; }
    location ^~ /luamud/agent/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8808/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /luamud/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    location /luamud/ws {
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}
